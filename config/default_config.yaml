model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  device: "auto"
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  num_repeats: 3

prompts:
  templates_path: "data/prompts/templates.yaml"
  per_combination: 5

analysis:
  sentiment_model: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  toxicity_model: "unitary/toxic-bert"
  regard_model: "sasha/regardv3"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 32

association_mining:
  min_support: 0.03
  min_confidence: 0.5
  min_lift: 1.3
  require_demographic_antecedent: true

subgroup_discovery:
  beam_width: 10
  max_depth: 3
  min_subgroup_size: 30
  quality_measure: "wracc"

anomaly_detection:
  encoder_dims: [384, 128, 32]
  decoder_dims: [32, 128, 384]
  epochs: 50
  learning_rate: 0.001
  batch_size: 64
  anomaly_percentile: 95

statistical_testing:
  alpha: 0.05
  correction_method: "benjamini-hochberg"
  min_group_size: 20
  effect_size_threshold: 0.3

output:
  results_dir: "results"
  figures_dir: "results/figures"
  report_path: "results/bias_report.md"
  model_card_path: "results/model_card.md"
  figure_dpi: 300
  figure_format: "png"
